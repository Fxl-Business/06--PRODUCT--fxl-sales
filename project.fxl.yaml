# project.fxl.yaml - FXL Harness project manifest for FXL Sales.
#
# Same format as the FXL Harness's own manifest. The Harness reads only the `prototipo` block
# (packages/engine/src/manifest/project-manifest.ts); the header keeps the repo-intrinsic facts in one place.
schemaVersion: 1

id: product.fxl-sales
name: FXL Sales
type: product
localSlot: 6 # folder number 06; ports below follow it

stack:
  runtime: node>=20
  language: typescript
  packageManager: pnpm@10

local:
  ports:
    frontend: 8006
    backend: 3006
    db: 5006

commands:
  install: pnpm install
  build: pnpm run build
  test: pnpm test
  lint: pnpm run lint

ai:
  rulePack: nexo # the methodology this repo ships on (CLAUDE.md + nexo/)

# `prototipo`: the prototype is the real app, signed in through the development identity. {port} is the
# port the engine gives. The engine starts Docker, runs `docker compose up -d db` from the main checkout,
# waits for 5006 and runs `command`. The script creates a scratch database on that Postgres (keyed by
# its pid), migrates and seeds it with `seed-dev.ts`, runs the real API with SALES_AUTH_FAKE on a free
# port and the web on {port}, and drops the database on SIGTERM or SIGINT. It refuses a non-local
# database host and never touches the developer's database or ports. Every identity of the roster is on
# the floating switcher. The engine runs `command` WITHOUT a shell, split on whitespace.
prototipo:
  modo: app
  servicos:
    - compose: docker-compose.yml
      servico: db
      porta: 5006
  command: pnpm --filter @fxl-sales/api exec tsx scripts/prototipo/run.ts --port {port}
  page: /
  # The screens, the UI kit, the seed and the identity roster: a new case is a new seed row or a new
  # roster identity, and the old ones stay as they are. The API, auth wiring and every config stay outside.
  fence:
    - apps/web/src/sales-ops/
    - apps/web/src/components/
    - apps/api/scripts/seed/
    - packages/auth-fake/src/
  fixtures: apps/api/scripts/seed/
  exclusivos:
    - apps/api/scripts/prototipo/
